name: tokilo
description: "Tokilo Business Hub - All-in-one business operating ecosystem"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  image_picker: ^1.1.2

  # Icons
  cupertino_icons: ^1.0.8

  # Supabase (Auth + Database)
  supabase_flutter: ^2.3.0

  # Navigation
  go_router: ^13.2.0

  # State Management
  url_launcher: ^6.3.1

  # Fonts
  google_fonts: ^6.2.1

  # Local Storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: 11.2.0

  # SVG support
  flutter_svg: ^2.0.10
  firebase_core: ^4.8.0
  firebase_messaging: ^16.2.1
  flutter_local_notifications: ^21.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  http: ^1.6.0
  web_socket_channel: ^3.0.3

  # ✅ App Icon Generator
  flutter_launcher_icons: ^0.14.3

# ✅ App Icon Configuration — uses your tokilologo.png
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/tokilologo.png"
  min_sdk_android: 21

  # Android adaptive icon (clean white background with your logo)
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/tokilologo.png"

  # iOS — removes transparency for App Store compliance
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/tokilo-studio.webp
  fonts:
    - family: TokiloSans
      fonts:
        - asset: assets/fonts/roboto-regular.ttf
          weight: 400
        - asset: assets/fonts/roboto-medium.ttf
          weight: 500
        - asset: assets/fonts/roboto-bold.ttf
          weight: 700
